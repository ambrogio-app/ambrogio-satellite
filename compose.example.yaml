services:
  satellite:
    image: ghcr.io/ambrogio-app/ambrogio-satellite:${AMBROGIO_SATELLITE_VERSION:?Set AMBROGIO_SATELLITE_VERSION}
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./config.example.ts:/config/satellite.ts:ro
    environment:
      AMBROGIO_BACKEND_URL: ${AMBROGIO_BACKEND_URL:?Set AMBROGIO_BACKEND_URL}
      AMBROGIO_CLIENT_ID: ${AMBROGIO_CLIENT_ID:-}
      AMBROGIO_CLIENT_NAME: ${AMBROGIO_CLIENT_NAME:-}
      AMBROGIO_MICROPHONE: ${AMBROGIO_MICROPHONE:-}
      AMBROGIO_SPEAKER: ${AMBROGIO_SPEAKER:-}
      AMBROGIO_ATTENUATION_DEVICE: ${AMBROGIO_ATTENUATION_DEVICE:-}
      AMBROGIO_ATTENUATION_CONTROL: ${AMBROGIO_ATTENUATION_CONTROL:-}
      AMBROGIO_ATTENUATION_LEVEL: ${AMBROGIO_ATTENUATION_LEVEL:-}
      AMBROGIO_WAKE_WORD_MODEL: ${AMBROGIO_WAKE_WORD_MODEL:-hey_jarvis}
      AMBROGIO_WAKE_WORD_THRESHOLD: ${AMBROGIO_WAKE_WORD_THRESHOLD:-0.5}
      AMBROGIO_WAKE_WORD_PATIENCE: ${AMBROGIO_WAKE_WORD_PATIENCE:-2}
      AMBROGIO_REPLY_TIMEOUT_MS: ${AMBROGIO_REPLY_TIMEOUT_MS:-15000}
