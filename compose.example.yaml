# Example deployment of the voice satellite. Only the values without a default are set here; add any
# other AMBROGIO_* variable of the configuration reference to change a default.
services:
  satellite:
    image: ghcr.io/ambrogio-app/ambrogio-satellite:${AMBROGIO_SATELLITE_VERSION:?Set AMBROGIO_SATELLITE_VERSION}
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    environment:
      AMBROGIO_ENV: production
      AMBROGIO_BACKEND_URL: ${AMBROGIO_BACKEND_URL:?Set AMBROGIO_BACKEND_URL}
