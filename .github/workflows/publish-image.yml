name: Publish Docker image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: satellite-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  publish:
    needs: [checks, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          test "$version" = "${GITHUB_REF_NAME#v}"
          echo "IMAGE=ghcr.io/ambrogio-app/ambrogio-satellite:$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and verify both images
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$IMAGE-$arch" .
            node scripts/verify-docker-image.mjs "$IMAGE-$arch" "$arch"
          done

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish verified images and release manifest
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE-amd64"
          docker push "$IMAGE-arm64"
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect --raw "$IMAGE" > "$RUNNER_TEMP/release-manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$RUNNER_TEMP/release-manifest.json"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
